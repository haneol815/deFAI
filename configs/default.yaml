# Federated learning experiment config
seed: 42
device: auto            # auto | cpu | cuda | mps

data:
  dataset: mnist        # mnist | cifar10
  root: ./data
  partition: iid        # iid | dirichlet
  alpha: 0.5            # Dirichlet concentration (non-IID only; smaller = more skewed)

fl:
  num_clients: 10
  clients_per_round: 5
  rounds: 20
  algorithm: fedavg     # fedavg | fedprox
  mu: 0.01              # FedProx proximal term

client:
  local_epochs: 1
  batch_size: 32
  lr: 0.01
  momentum: 0.0

output_dir: ./results
