[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "defai"
version = "0.1.0"
description = "Federated learning assignment template built on Flower"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    "flwr[simulation]>=1.40.0",
    "flwr-datasets[vision]>=0.6.1",
    "torch>=2.1",
    "torchvision>=0.16",
]

[project.optional-dependencies]
plot = ["matplotlib"]
test = ["pytest", "pytest-cov", "dp-accounting", "ruff"]  # dp-accounting only cross-checks the RDP accountant

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "rixile9999"
fab-format-version = 1
flwr-version-target = "1.40.0"

[tool.flwr.app.components]
serverapp = "defai.server_app:app"
clientapp = "defai.client_app:app"

# Override at runtime: flwr run . --run-config "num-server-rounds=20 strategy='fedprox'"
[tool.flwr.app.config]
# federation
num-server-rounds = 10
# fedavg | fedprox | moon | scaffold | fedavgm | fedadagrad | fedadam | fedyogi
# | fedmedian | fedtrimmedavg | krum | multikrum | bulyan
strategy = "fedavg"
fraction-train = 0.5        # fraction of SuperNodes sampled per round
fraction-evaluate = 0.5
# data
dataset = "mnist"           # mnist | cifar10 | synthetic (offline, for smoke tests)
partitioner = "iid"         # iid | dirichlet
dirichlet-alpha = 0.5       # smaller = more non-IID
seed = 42
# local training
local-epochs = 1
batch-size = 32
learning-rate = 0.01
lr-decay = 1.0             # client lr in round t = learning-rate * lr-decay^(t-1)
# non-IID algorithms
proximal-mu = 0.01          # fedprox: weight of the proximal term
moon-mu = 1.0               # moon: weight of the contrastive loss
moon-temperature = 0.5      # moon: softmax temperature
# server optimisation
server-learning-rate = 1.0  # fedavg / fedprox / moon / scaffold / robust rules: scales the aggregated update
server-momentum = 0.9       # fedavgm
fedopt-learning-rate = 0.01 # fedadagrad / fedadam / fedyogi: server step size (eta)
beta-1 = 0.9                # fedopt first-moment decay
beta-2 = 0.99               # fedopt second-moment decay (fedadam / fedyogi)
tau = 1e-3                  # fedopt adaptivity
# robust aggregation
trim-ratio = 0.2            # fedtrimmedavg: fraction trimmed from each side
num-byzantine = 1           # krum / multikrum / bulyan: assumed number f of malicious clients per round (bulyan needs 4f+3 replies)
multikrum-select = 3        # multikrum: number of updates averaged
# malicious-client simulation (clients with partition-id < num-malicious misbehave)
attack = "none"             # none | label-flip | sign-flip | gaussian
num-malicious = 0
attack-scale = 1.0          # sign-flip: multiplier; gaussian: std of the replacement update
# client failures
dropout-rate = 0.0          # probability that a sampled client does not answer a train message
# differential privacy (mean-based strategies only)
dp = "none"                 # none | fixed | adaptive
dp-side = "server"          # server: server clips | client: clients clip (server still enforces the bound)
dp-noise-multiplier = 1.0   # z: noise std = z * clip-norm / clients-per-round
dp-clip-norm = 1.0          # C (initial value for adaptive clipping)
dp-delta = 1e-5
dp-max-epsilon = 0.0        # stop training before epsilon would exceed this (0 = no limit)
dp-target-quantile = 0.5    # adaptive: fraction of updates that should be unclipped
dp-clip-lr = 0.2            # adaptive: learning rate of the clip-norm update
dp-clipped-count-stddev = 0.0  # adaptive: noise std on the clipped count (0 = max(clients-per-round / 20, dp-noise-multiplier))
# output
output-dir = "results"
save-model = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Bug-finding rules only; the code base does not enforce a formatter or import order.
select = ["F", "E9", "B", "UP", "SIM"]
ignore = ["E501", "B905"]  # long lines are tolerated; zip(strict=) is not required
